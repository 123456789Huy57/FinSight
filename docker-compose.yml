services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_VNSTOCK: ${INSTALL_VNSTOCK:-false}
    ports:
      - "8000:8000"
    volumes:
      - vnstock_auth:/data/vnstock
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=deepseek/deepseek-chat-v3.1
      - DATABASE_URL=postgresql+asyncpg://finsight:finsight@db:5432/finsight
      - REDIS_URL=redis://redis:6379/0
      - MARKET_PROVIDER=${MARKET_PROVIDER:-csv}
      - VNSTOCK_API_KEY=${VNSTOCK_API_KEY:-}
      - VNSTOCK_SYMBOLS=${VNSTOCK_SYMBOLS:-VCB,ACB,MBB,BID,FPT,CMG,SSI,VRE,DXG,PVD,POW,GAS,HPG,SAB,KDC}
      - VNSTOCK_REQUEST_DELAY_SECONDS=${VNSTOCK_REQUEST_DELAY_SECONDS:-6}
      - NEWS_FEED_ENABLED=${NEWS_FEED_ENABLED:-true}
      - RUN_SNAPSHOT_JOBS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_VNSTOCK: ${INSTALL_VNSTOCK:-false}
    command: ["python", "worker.py"]
    volumes:
      - vnstock_auth:/data/vnstock
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=deepseek/deepseek-chat-v3.1
      - DATABASE_URL=postgresql+asyncpg://finsight:finsight@db:5432/finsight
      - REDIS_URL=redis://redis:6379/0
      - MARKET_PROVIDER=${MARKET_PROVIDER:-csv}
      - VNSTOCK_API_KEY=${VNSTOCK_API_KEY:-}
      - VNSTOCK_SYMBOLS=${VNSTOCK_SYMBOLS:-VCB,ACB,MBB,BID,FPT,CMG,SSI,VRE,DXG,PVD,POW,GAS,HPG,SAB,KDC}
      - VNSTOCK_REQUEST_DELAY_SECONDS=${VNSTOCK_REQUEST_DELAY_SECONDS:-6}
      - NEWS_FEED_ENABLED=${NEWS_FEED_ENABLED:-true}
      - RUN_SNAPSHOT_JOBS=true
    depends_on:
      backend:
        condition: service_healthy
    restart: always


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  vnstock_auth:
