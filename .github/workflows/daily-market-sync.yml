name: Daily market data sync

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      MARKET_PROVIDER: vnstock
      NEWS_FEED_ENABLED: "true"
      DATABASE_URL: ${{ secrets.MARKET_DATABASE_URL }}
      REDIS_URL: ""
      JWT_SECRET: ${{ secrets.MARKET_JWT_SECRET }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_HOME: ${{ github.workspace }}/.vnstock
      VNSTOCK_SYMBOLS: ALL
      VNSTOCK_PRIORITY_SYMBOLS: HPG,FPT,VCB,ACB,MBB,BID,SSI,VHM,VIC,VRE
      VNSTOCK_REQUEST_DELAY_SECONDS: "6"
      PROVIDER_RPM: "60"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - name: Restore Vnstock device identity
        uses: actions/cache@v4
        with:
          path: .vnstock
          key: vnstock-device-${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-vnstock.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-vnstock.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Refresh market data
        run: python -m scripts.daily_sync
