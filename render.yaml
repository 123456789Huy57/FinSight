services:
  - type: web
    name: finsight-free
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MARKET_PROVIDER
        value: vnstock
      - key: NEWS_FEED_ENABLED
        value: "true"
      - key: RUN_SNAPSHOT_JOBS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat-v3.1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
